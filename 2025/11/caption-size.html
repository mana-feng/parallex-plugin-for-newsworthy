        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: transparent;
            padding: 0;
            margin: 0;
        }
        /* Text alignment classes (for compatibility) */
        .text-align-left {
            text-align: left;
        }
        .text-align-center {
            text-align: center;
        }
        
        /* Text alignment inline styles (TipTap uses inline styles) */
        [style*="text-align: left"],
        [style*="text-align:left"] {
            text-align: left !important;
        }
        [style*="text-align: center"],
        [style*="text-align:center"] {
            text-align: center !important;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Georgia, "Times New Roman", Times, serif;
            line-height: 1.75;
            color: #111111;
            background-color: #ffffff;
        }
    
        .section-block {
            /* Section should always fill full width */
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            min-height: 200px;
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            /* Default white background - ensures full-width background coverage */
            /* Individual sections can override this via inline styles */
            background-color: #fff;
            /* Smooth transition for real-time responsiveness */
            transition: all 0.2s ease;
        }

        .section-block img,
        .section-block video {
            max-width: 100%;
            height: auto;
            display: block;
            transition: all 0.2s ease;
        }
    
        .block-wrapper {
            /* Add horizontal and vertical padding to content blocks */
            padding: clamp(12px, 2vw, 24px) clamp(16px, 3vw, 32px);
            transition: padding 0.2s ease;
            /* Center content and limit max-width for readability on large screens */
            margin: 0 auto;
            max-width: 960px;
        }
    
        .article-container {
            width: 100%;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
    
        /* All screen sizes: section stretches to full width */
        .section,
        .section-block {
            max-width: 100%;
            width: 100%;
        }

        /* Mobile: 0 - 479px */
        @media (max-width: 479px) {
            .section {
                min-height: auto !important;
            }

            .section-block {
                min-height: auto;
            }

            .info-banner {
                font-size: clamp(11px, 2.5vw, 14px);
                padding: clamp(6px, 1.5vw, 12px);
            }
        }
    
        
        .section {
            margin: 0;
            box-sizing: border-box;
            position: relative;
            border-top: 2px solid #e5e7eb;
            /* Remove padding to let background color/image extend to edges */
            padding: 0;
            overflow: visible;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Full width, no max-width restriction */
            width: 100%;
            max-width: 100%;
            /* Default white background - ensures full-width background coverage */
            /* Individual sections can override this via inline styles */
            background-color: #fff;
            /* Smooth transition for real-time responsiveness */
            transition: all 0.2s ease;
        }
    
        
        .prose {
            background: transparent;
            border: 1px solid transparent;
            min-height: 50px;
            padding: clamp(4px, 1vw, 8px);
            transition: padding 0.2s ease;
        }

        .prose h1 {
            font-size: clamp(1.5em, 4vw, 2.5em);
            font-weight: 700;
            margin: 0.67em 0;
            line-height: 1.2;
        }

        .prose h2 {
            font-size: clamp(1.25em, 3vw, 2em);
            font-weight: 700;
            margin: 0.83em 0;
            line-height: 1.3;
        }

        .prose h3 {
            font-size: clamp(1.15em, 2.5vw, 1.3em);
            font-weight: 700;
            margin: 1em 0;
            line-height: 1.4;
        }

        .prose p {
            font-size: clamp(0.9em, 2vw, 1.2em);
            line-height: 1.6;
            margin: 1em 0;
        }

        .prose ul, .prose ol {
            font-size: clamp(0.95em, 1.5vw, 1em);
            line-height: 1.6;
        }

        .text-wrapper {
            transition: max-width 0.25s ease, padding 0.2s ease;
            padding: clamp(0.25rem, 1vw, 0.5rem) 0;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            overflow-wrap: anywhere;
            word-break: break-word;
            max-width: min(var(--block-max, 65ch), var(--device-text-max, 65ch), 95%);
        }

        .text-block {
            /* Width is controlled by inline style, not hardcoded here */
            width: 100%;
            margin: 0 auto;
            /* Padding is provided by block-wrapper */
            padding: 0;
        }

        .text-block h1 {
            /* Fluid font size: scales between 1.5em and 2em based on viewport */
            font-size: clamp(1.5em, 4vw, 2em);
            font-weight: 700;
            margin: 0.67em 0;
            line-height: 1.2;
        }

        .text-block h2 {
            /* Fluid font size: scales between 1.25em and 1.5em */
            font-size: clamp(1.25em, 3vw, 1.5em);
            font-weight: 700;
            margin: 0.83em 0;
            line-height: 1.3;
        }

        .text-block p {
            /* Fluid font size for better readability on all screens */
            font-size: clamp(0.95em, 1.5vw, 1em);
            line-height: 1.6;
            margin: 1em 0;
        }

        .text-block strong {
            font-weight: 700;
        }

        .text-block em {
            font-style: italic;
        }

        .text-block a {
            color: #2563eb;
            text-decoration: underline;
        }

        .text-block a:hover {
            color: #1d4ed8;
        }

        .text-block ul, .text-block ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        .text-block li {
            margin: 0.5em 0;
        }

        /* Responsive adjustments */
        @media (max-width: 767px) {
            .text-wrapper {
                max-width: 95%;
            }
        }

        @media (max-width: 479px) {
            .text-wrapper {
                max-width: 100%;
            }

            .prose {
                padding: clamp(2px, 0.5vw, 4px);
            }
        }

        @media (min-width: 1920px) {
            .text-wrapper {
                max-width: min(var(--block-max, 75ch), var(--device-text-max, 75ch), 95%);
            }
        }

        @media (max-width: 1024px) {
            [style*="font-size"] {
                font-size: calc(0.95 * 1em) !important;
            }
        }

        @media (max-width: 768px) {
            [style*="font-size"] {
                font-size: calc(0.8 * 1em) !important;
            }
        }

        @media (max-width: 480px) {
            [style*="font-size"] {
                font-size: calc(0.65 * 1em) !important;
            }
        }
    
        
        /* Image Block Styles - matching editor styles */
        .image-block {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: clamp(8px, 1.5vw, 10px) 0;
            padding: 0;
        }

        .block-wrapper.fullwidth-wrapper {
            width: 100%;      
            max-width: 100%;
            margin: 0;
            padding: 0;
        }
        
        .image-block img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
            transition: all 0.2s ease;
        }
        
        /* Fullwidth Image Block Styles */
        .fullwidth-image-block {
            width: 100%;
            display: block;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .fullwidth-wrapper + .fullwidth-wrapper .fullwidth-image-block {
            margin-top: clamp(8px, 1.5vw, 16px);
        }
        
        .fullwidth-image-block img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 0;
            display: block;
            position: relative;
            transition: all 0.2s ease;
        }

        /* Caption setting */
        .image-caption {
            font-size: 0.9rem;
            line-height: 1.4;
            font-style: italic;
            color: #666;
        }

        /* bottom caption */
            .image-caption.bottom {
            text-align: center;
            margin-top: 6px;
            display: block;
            width: 100%;
        }

        .fullwidth-image-block.bottom .image-caption {
            text-align: center;
            color: #666;
            margin-top: 6px;
            font-size: 0.9rem;
            font-style: italic;
        }

        /* bubble caption */
        .image-caption.bubble {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            line-height: 1.3;
            max-width: 70%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-block:hover .image-caption.bubble,
        .fullwidth-image-block:hover .image-caption.bubble {
            opacity: 1;
        }
        
        .image-caption.bubble.animated {
            animation: fadeInBubble 0.4s ease-in-out forwards;
        }

        @keyframes fadeInBubble {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Float Image Container - matching editor layout */
        .float-image-container {
            display: flex;
            gap: clamp(0.75rem, 2vw, 1rem);
            align-items: flex-start;
            flex-wrap: wrap;
        }
        
        .float-text-content {
            flex: 1;
            min-width: 200px;
        }
        
        /* Float Image Block Styles */
        .float-image-block {
            display: block;
            margin: 1em 0;
            overflow: hidden;
        }
        
        .float-image-block img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;

        .float-image-block .image-caption {
            font-size: 0.85rem;
            color: #666;
            margin: 4px 0 0;

        .image-block.image-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin: 20px auto;
            width: 100%;
        }

        @media (max-width: 768px) {
            .image-block.image-grid .image-cell {
                max-width: 100%;
            }
        }
        
        /* Responsive Design - Media Queries for Image Blocks */
        @media (max-width: 767px) {
            .float-image-container {
                flex-direction: column;
            }
            
            .float-image-block,
            .float-text-content {
                width: 100% !important;
                order: unset !important;
            }
            
            .float-image-block {
                float: none !important;
                margin: 10px auto !important;
                text-align: center;
                max-width: 90%;
            }
        }
        
        @media (max-width: 479px) {
            .float-image-block {
                float: none !important;
                margin: 10px auto !important;
                text-align: center;
                max-width: 100%;
            }
        }
    
        
        .video-block {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: clamp(8px, 1.5vw, 10px) 0;
        }
        .video-block iframe {
            max-width: 100%;
            border: none;
            border-radius: 4px;
            aspect-ratio: 16 / 9;
        }
        .video-fallback {
            max-width: 100%;
            transition: all 0.2s ease;
        }
        @media (max-width: 479px) {
            .video-block iframe,
            .video-fallback {
                width: 100%;
                height: auto;
            }
        }
    
        
        /* Parallax Section Styles */
        .parallax-container {
            position: relative;
            width: 100%;
        }

        .parallax-bg-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 0;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }

        .parallax-bg.active {
            opacity: 1;
        }

        .parallax-content {
            position: relative;
            z-index: 1;
            pointer-events: none;
        }

        .parallax-slide {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fluid padding for parallax slides */
            padding: clamp(1rem, 3vw, 2rem);
            transition: padding 0.2s ease;
        }

        .parallax-slide-content {
            /* Fluid max-width for parallax content */
            max-width: min(800px, 95%);
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            /* Fluid padding */
            padding: clamp(1.5rem, 4vw, 3rem);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            pointer-events: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
            transition: padding 0.2s ease;
        }
        .parallax-slide-content * {
            max-width: 100%;
        }

        .parallax-slide-content.transparent {
            background: transparent;
            box-shadow: none;
        }

        /* Responsive Design - Media Queries for Parallax */
        /* Laptop/Tablet landscape: 768px - 1199px */
        @media (min-width: 768px) and (max-width: 1199px) {
            .parallax-slide-content {
                max-width: min(600px, 90%);
            }
        }

        /* Tablet portrait: 480px - 767px */
        @media (min-width: 480px) and (max-width: 767px) {
            .parallax-slide-content {
                max-width: 95%;
            }
        }

        /* Mobile: 0 - 479px */
        @media (max-width: 479px) {
            .parallax-slide-content {
                max-width: 95%;
                border-radius: 4px;
            }
        }
    
    </style>
    <script>
        
        function loadYouTubeVideo(videoId, width, height) {
            const container = document.getElementById('video-' + videoId);
            if (!container) return;

            const fallback = container.querySelector('.video-fallback');
            const iframe = container.querySelector('.video-iframe');

            if (window.location.protocol === 'file:') {
                window.open('https://www.youtube.com/watch?v=' + videoId, '_blank');
            } else {
                if (fallback) fallback.style.display = 'none';
                if (iframe) {
                    iframe.style.display = 'block';
                    const currentSrc = iframe.src;
                    if (currentSrc.indexOf('autoplay') === -1) {
                        iframe.src = currentSrc + '?autoplay=1';
                    }
                }
            }
        }

        window.addEventListener('load', function() {
            const isFileProtocol = window.location.protocol === 'file:';
            if (!isFileProtocol) {
                const iframes = document.querySelectorAll('.video-iframe');
                const fallbacks = document.querySelectorAll('.video-fallback');
            }
        });
    
        
        // Parallax scrolling effect
        document.addEventListener('DOMContentLoaded', function() {
            const parallaxContainers = document.querySelectorAll('.parallax-container');

            parallaxContainers.forEach(container => {
                const backgrounds = container.querySelectorAll('.parallax-bg');
                const slides = container.querySelectorAll('.parallax-slide');

                if (backgrounds.length === 0 || slides.length === 0) return;

                function updateParallax() {
                    const containerTop = container.getBoundingClientRect().top;
                    const containerHeight = container.offsetHeight;
                    const windowHeight = window.innerHeight;

                    // Calculate scroll progress within container
                    const scrollProgress = -containerTop / (containerHeight - windowHeight);
                    const clampedProgress = Math.max(0, Math.min(1, scrollProgress));

                    // Calculate which slide should be active
                    const slideIndex = Math.floor(clampedProgress * slides.length);
                    const activeIndex = Math.min(slideIndex, slides.length - 1);

                    // Update background visibility
                    backgrounds.forEach((bg, index) => {
                        if (index === activeIndex) {
                            bg.classList.add('active');
                        } else {
                            bg.classList.remove('active');
                        }
                    });
                }

                // Initial update
                updateParallax();

                // Update on scroll
                window.addEventListener('scroll', updateParallax, { passive: true });
                window.addEventListener('resize', updateParallax, { passive: true });
            });
        });
    
    </script>
